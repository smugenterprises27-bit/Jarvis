name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q jarvis-project.zip -d proj
      - name: Download voice model
        run: |
          mkdir -p proj/app/src/main/assets
          curl -L -o proj/app/src/main/assets/model.zip https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: gradle assembleDebug --no-daemon
        working-directory: proj
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-apk
          path: proj/app/build/outputs/apk/debug/app-debug.apk
